example.message=I am running in the DEV environment!
server.port=8081

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

grpc.client.system-events-channel.address=discovery:///system-events
grpc.client.system-events-channel.negotiation-type=plaintext

spring.rabbitmq.host=${RABBITMQ_HOST}
spring.rabbitmq.port=${RABBITMQ_PORT}
spring.rabbitmq.username=${RABBITMQ_USERNAME}
spring.rabbitmq.password=${RABBITMQ_PASSWORD}



spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/orderdb
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASS}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true
