example.message=I am running in the DEV environment!
server.port=8081
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
spring.cloud.gateway.discovery.locator.enabled=true
spring.cloud.gateway.discovery.locator.lower-case-service-id=true


jwt.public.key=${JWT_PUBLIC_KEY}


spring.cloud.gateway.discovery.locator.enabled=false

spring.cloud.gateway.routes[0].id=auth-service
spring.cloud.gateway.routes[0].uri=lb://auth-service
spring.cloud.gateway.routes[0].predicates[0]=Path=/auth/**

spring.cloud.gateway.routes[1].id=order-service
spring.cloud.gateway.routes[1].uri=lb://order
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/orders/**, /api/income/**, /api/shipments/**
spring.cloud.gateway.routes[1].filters[0]=AuthenticationFilter

spring.cloud.gateway.routes[2].id=product-service
spring.cloud.gateway.routes[2].uri=lb://product
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/materials/**, /api/categories/**, /api/chairs/**, /api/chair-variants/**, /api/color-options/**, /api/dimensions/**, /api/suppliers/**, /api/products/uploads/**
spring.cloud.gateway.routes[2].filters[0]=AuthenticationFilter
