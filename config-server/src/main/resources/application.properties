server.port=8888
spring.application.name=config-server
spring.cloud.config.server.git.search-paths=config-data/
spring.cloud.config.server.git.default-label=centralized-config
spring.cloud.config.server.git.clone-on-start=true

spring.security.user.name=${CONFIG_USER:admin}
spring.security.user.password=${CONFIG_PASSWORD}
spring.cloud.config.server.git.uri=https://github.com/jromano17/comfort-corner
spring.cloud.config.server.git.username=${GIT_USERNAME:}
spring.cloud.config.server.git.password=${GIT_TOKEN:}
